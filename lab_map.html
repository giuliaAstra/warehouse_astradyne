<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.header{background:#0f1f3d;color:#fff;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.header h1{font-size:14px;font-weight:600}
.mode-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mbtn{padding:5px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.15s}
.mbtn.active{background:#fff;color:#0f1f3d}
.mbtn:not(.active){background:rgba(255,255,255,0.13);color:#fff}
.mbtn:hover:not(.active){background:rgba(255,255,255,0.22)}
.color-row{display:flex;gap:5px;margin-left:8px}
.zcolor{width:22px;height:22px;border-radius:4px;border:2px solid transparent;cursor:pointer;transition:all 0.1s}
.zcolor.active{border-color:#fff;transform:scale(1.2)}
.hint{font-size:11px;opacity:0.5;margin-left:6px}

.map-wrap{background:#fff;margin:12px;border-radius:12px;border:1px solid #e0e0e0;padding:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#666}
.ldot{width:10px;height:10px;border-radius:2px;display:inline-block}
#mainsvg{width:100%;border-radius:6px;display:block}

/* Side panel */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.18);z-index:99;display:none}
.overlay.show{display:block}
.side-panel{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,0.13);z-index:100;transition:right 0.28s ease;display:flex;flex-direction:column}
.side-panel.open{right:0}
.sp-head{color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sp-head h2{font-size:15px;font-weight:600}
.sp-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;opacity:0.8;line-height:1}
.sp-close:hover{opacity:1}
.sp-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}

.sec-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.edit-btn{padding:3px 10px;background:#f0f2f5;border:1px solid #e0e0e0;border-radius:5px;font-size:11px;cursor:pointer;color:#555;font-weight:600}
.edit-btn:hover{background:#e4e6f0}

.area-name-disp{font-size:15px;font-weight:700;color:#0f1f3d;padding:8px 12px;background:#f0f2f5;border-radius:8px;min-height:38px}
.resp-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#f8f9fc;border-radius:8px}
.resp-av{width:34px;height:34px;border-radius:50%;background:#0f1f3d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.resp-name{font-size:13px;font-weight:600}
.rules-box{background:#fffde7;border:1px solid #f9e79f;border-radius:8px;padding:12px;font-size:13px;color:#555;line-height:1.65;white-space:pre-wrap;min-height:52px}
.empty-hint{color:#bbb;font-style:italic;font-size:12px}
.item-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8f9fc;border-radius:8px;border:1px solid #eee;margin-bottom:5px}
.item-name{flex:1;font-size:13px;font-weight:500}
.qty-btn{width:26px;height:26px;border-radius:5px;border:1px solid #e0e0e0;background:#fff;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#555}
.qty-btn:hover{background:#f0f2f5}
.qty-num{font-size:13px;font-weight:600;min-width:26px;text-align:center}
.item-del{background:none;border:none;cursor:pointer;color:#ccc;font-size:17px;padding:0 2px;line-height:1}
.item-del:hover{color:#e74c3c}
.add-row{display:flex;gap:6px;margin-top:6px}
.add-inp{flex:1;padding:7px 10px;border:1px solid #e0e0e0;border-radius:7px;font-size:13px;outline:none}
.add-inp:focus{border-color:#0f1f3d}
.add-qty{width:58px;padding:7px 8px;border:1px solid #e0e0e0;border-radius:7px;font-size:13px;outline:none}
.field-inp{width:100%;padding:8px 10px;border:1px solid #e0e0e0;border-radius:7px;font-size:13px;outline:none;margin-bottom:6px}
.field-inp:focus{border-color:#0f1f3d}
.field-ta{width:100%;padding:9px 10px;border:1px solid #e0e0e0;border-radius:7px;font-size:13px;outline:none;resize:vertical;min-height:90px;line-height:1.6}
.field-ta:focus{border-color:#0f1f3d}
.btn-row{display:flex;gap:6px;margin-top:4px}
.save-btn{padding:7px 16px;background:#0f1f3d;color:#fff;border:none;border-radius:7px;font-size:12px;cursor:pointer;font-weight:600}
.save-btn:hover{background:#1a2f5a}
.cancel-btn{padding:7px 14px;background:#f0f2f5;color:#555;border:none;border-radius:7px;font-size:12px;cursor:pointer}
.del-btn{width:100%;padding:8px;background:#fff;color:#e74c3c;border:1px solid #e74c3c;border-radius:7px;font-size:12px;cursor:pointer;font-weight:600;margin-top:4px}
.del-btn:hover{background:#fff0f0}
.dims-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dim-lbl{font-size:11px;color:#999;margin-bottom:3px}

/* ── NEW LAYOUT ── */
.main-layout{display:grid;grid-template-columns:1fr 260px;gap:0;height:calc(100vh - 52px)}
.map-area{background:#fff;overflow:auto;padding:12px}
.list-panel{background:#fff;border-left:1px solid #e0e0e0;display:flex;flex-direction:column;overflow:hidden}
.lp-head{padding:12px 14px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.lp-title{font-size:12px;font-weight:700;color:#444;margin-bottom:8px}
.lp-filter{display:flex;flex-direction:column;gap:6px}
.lp-select{width:100%;padding:5px 8px;border:1px solid #e0e0e0;border-radius:6px;font-size:11px;outline:none;background:#fff}
.lp-search{width:100%;padding:5px 8px;border:1px solid #e0e0e0;border-radius:6px;font-size:11px;outline:none}
.lp-search:focus,.lp-select:focus{border-color:#0f1f3d}
.lp-list{flex:1;overflow-y:auto;padding:8px}
.lp-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;border:1px solid #f0f0f0;margin-bottom:5px;cursor:pointer;transition:all 0.12s;background:#fafafa}
.lp-item:hover{background:#f0f2f5;border-color:#ddd}
.lp-item.active{background:#e8edf8;border-color:#b0bde8}
.lp-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.lp-name{font-size:12px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-sub{font-size:10px;color:#aaa;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-badge{font-size:10px;font-weight:700;color:#fff;background:#0f1f3d;border-radius:10px;padding:1px 6px;flex-shrink:0}
.lp-empty{font-size:12px;color:#bbb;font-style:italic;padding:12px 8px;text-align:center}
/* view tabs */
.view-tabs{display:flex;gap:4px;padding:0 14px 10px}
.vtab{flex:1;padding:5px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;cursor:pointer;font-size:11px;font-weight:600;color:#888;text-align:center;transition:all 0.12s}
.vtab.active{background:#0f1f3d;color:#fff;border-color:#0f1f3d}
/* header compact */
.header{padding:8px 16px}
.header h1{font-size:13px}
</style>

<script>
// ── CONSTANTS ──
const SVG_NS = 'http://www.w3.org/2000/svg';
const OX=50, OY=47, WF=784, HF=425, SNAP=36;

// ── ELEMENTS DATA ──
const ELEMENTS = [
  {id:'1',label:'①',name:'Ecoflam',color:'#f4a460',stroke:'#c0622a',x:190,y:57,w:414,h:108},

  {id:'15',label:'⑮',name:'Clean room ⑮',color:'#90ee90',stroke:'#1e8449',x:540,y:300,w:137,h:115},
  {id:'16',label:'⑯',name:'Bench ⑯',color:'#87ceeb',stroke:'#2471a3',x:525,y:370,w:13,h:50},
  {id:'17a',label:'⑰',name:'Cabinet ⑰a',color:'#dda0dd',stroke:'#7d3c98',x:780,y:255,w:16,h:43},
  {id:'17b',label:'⑰',name:'Cabinet ⑰b',color:'#dda0dd',stroke:'#7d3c98',x:780,y:304,w:16,h:50},
  {id:'18',label:'⑱',name:'Table ⑱',color:'#87ceeb',stroke:'#2471a3',x:756,y:165,w:22,h:65},
  {id:'19',label:'⑲',name:'Table ⑲',color:'#87ceeb',stroke:'#2471a3',x:756,y:360,w:25,h:80},
  {id:'20',label:'⑳',name:'Motor ⑳',color:'#f4a460',stroke:'#c0622a',x:57,y:57,w:36,h:50},
  {id:'21',label:'㉑',name:'Elec. panel',color:'#f4a460',stroke:'#c0622a',x:57,y:115,w:18,h:11},
  {id:'22',label:'㉒',name:'Table ㉒',color:'#87ceeb',stroke:'#2471a3',x:97,y:57,w:36,h:54},
];

// ── FIREBASE ──
const firebaseConfig = {
  apiKey: "AIzaSyBGjBhr0MTTPlaFCvduXY9vNgdF9mg2Yjw",
  authDomain: "astradyne-lab.firebaseapp.com",
  projectId: "astradyne-lab",
  storageBucket: "astradyne-lab.firebasestorage.app",
  messagingSenderId: "995216004352",
  appId: "1:995216004352:web:93a68fc975c5761abd8fe5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function setSyncStatus(ok){
  const dot=document.getElementById('sync-dot');
  if(dot){dot.style.background=ok?'#27ae60':'#e74c3c';dot.title=ok?'Synced':'Sync error';}
}

// ── STORAGE (Firebase + localStorage fallback) ──
function ls(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch(e){return null;}}
function lsSet(key,val){localStorage.setItem(key,JSON.stringify(val));}

let _zones=null,_zdata={},_epos=null,_edata={};

function getZones(){return _zones||ls('wh_zones')||[];}
function setZones(z){
  _zones=z;lsSet('wh_zones',z);
  db.collection('config').doc('zones').set({data:JSON.stringify(z)})
    .then(()=>setSyncStatus(true)).catch(()=>setSyncStatus(false));
}
function getZoneData(id){return _zdata[id]||ls('wh_zdata_'+id)||{areaName:'',resp:'',rules:'',items:[]};}
function setZoneData(id,d){
  _zdata[id]=d;lsSet('wh_zdata_'+id,d);
  db.collection('zonedata').doc(id).set(d)
    .then(()=>setSyncStatus(true)).catch(()=>setSyncStatus(false));
}
function getElemPos(){return _epos||ls('wh_epos')||{};}
function setElemPos(p){
  _epos=p;lsSet('wh_epos',p);
  db.collection('config').doc('elempos').set({data:JSON.stringify(p)})
    .then(()=>setSyncStatus(true)).catch(()=>setSyncStatus(false));
}
function getElemData(id){return _edata[id]||ls('wh_edata_'+id)||{name:'',rules:'',items:[]};}
function setElemData(id,d){
  _edata[id]=d;lsSet('wh_edata_'+id,d);
  db.collection('elemdata').doc(id).set(d)
    .then(()=>setSyncStatus(true)).catch(()=>setSyncStatus(false));
}

async function loadFromFirebase(){
  try{
    const [zonesDoc,eposDoc,zdataDocs,edataDocs,customDoc,deletedDoc]=await Promise.all([
      db.collection('config').doc('zones').get(),
      db.collection('config').doc('elempos').get(),
      db.collection('zonedata').get(),
      db.collection('elemdata').get(),
      db.collection('config').doc('customelems').get(),
      db.collection('config').doc('deletedelems').get(),
    ]);
    if(zonesDoc.exists){_zones=JSON.parse(zonesDoc.data().data);lsSet('wh_zones',_zones);}
    if(eposDoc.exists){_epos=JSON.parse(eposDoc.data().data);lsSet('wh_epos',_epos);}
    zdataDocs.forEach(doc=>{_zdata[doc.id]=doc.data();lsSet('wh_zdata_'+doc.id,doc.data());});
    edataDocs.forEach(doc=>{_edata[doc.id]=doc.data();lsSet('wh_edata_'+doc.id,doc.data());});
    if(customDoc.exists){const c=JSON.parse(customDoc.data().data);lsSet('wh_custom_elems',c);}
    if(deletedDoc.exists){const d=JSON.parse(deletedDoc.data().data);lsSet('wh_deleted_elems',d);}
    setSyncStatus(true);
  }catch(e){
    console.warn('Firebase load failed, using localStorage:',e);
    setSyncStatus(false);
  }
}

function startRealtimeSync(){
  db.collection('zonedata').onSnapshot(snap=>{
    snap.docChanges().forEach(c=>{_zdata[c.doc.id]=c.doc.data();});
    renderZones();renderListPanel();
  });
  db.collection('elemdata').onSnapshot(snap=>{
    snap.docChanges().forEach(c=>{_edata[c.doc.id]=c.doc.data();});
    renderElements();
  });
  db.collection('config').onSnapshot(snap=>{
    snap.docChanges().forEach(c=>{
      if(c.doc.id==='zones'){_zones=JSON.parse(c.doc.data().data);renderZones();renderListPanel();}
      if(c.doc.id==='elempos'){_epos=JSON.parse(c.doc.data().data);renderElements();}
      if(c.doc.id==='customelems')lsSet('wh_custom_elems',JSON.parse(c.doc.data().data));
      if(c.doc.id==='deletedelems')lsSet('wh_deleted_elems',JSON.parse(c.doc.data().data));
    });
  });
}

// ── STATE ──
let mode = 'view';
let zones = [];
let elemPos = {};
let zoneFill = 'rgba(52,152,219,0.18)';
let zoneStroke = 'rgba(41,128,185,0.8)';
let drawing = false, drawStart = null;
let draggingElem = null, dragOffX = 0, dragOffY = 0;
let currentZoneId = null, currentElemId = null;
let selectedElemId = null;

// ── HELPERS ──
function darken(c){return{'#f4a460':'#7a3800','#87ceeb':'#154360','#dda0dd':'#4a0080','#90ee90':'#145214'}[c]||'#333';}
function snapV(v){return Math.round(v/SNAP)*SNAP;}
function getSVGPt(cx,cy){
  const svg=document.getElementById('mainsvg');
  const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function applyEPos(e){
  const p=elemPos[e.id];
  return p?{...e,...p}:e;
}
function getElemName(e){
  const d=getElemData(e.id);
  return d.name||e.name;
}

// ── MODE ──
function setMode(m){
  mode=m;
  ['view','draw','edit'].forEach(x=>{
    document.getElementById('btn-'+x).className='mbtn'+(m===x?' active':'');
  });
  document.getElementById('color-row').style.display=m==='draw'?'flex':'none';
  const hints={view:'click element or zone to manage',draw:'choose color then drag to draw a zone',edit:'drag elements to move · click to rename/resize'};
  document.getElementById('mode-hint').textContent=hints[m];
  if(m==='draw'||m==='view'){
    selectedElemId=null;
    closePanel();
  }
  renderElements();
}

function selectColor(btn){
  document.querySelectorAll('.zcolor').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  zoneFill=btn.getAttribute('data-fill');
  zoneStroke=btn.getAttribute('data-stroke');
  document.getElementById('draw-preview').setAttribute('fill',zoneFill);
  document.getElementById('draw-preview').setAttribute('stroke',zoneStroke);
}

// ── DRAW ZONE ──
const svg = document.getElementById('mainsvg');
svg.addEventListener('mousedown', ev=>{
  if(mode!=='draw')return;
  ev.preventDefault();
  const pt=getSVGPt(ev.clientX,ev.clientY);
  drawStart={x:Math.max(OX,Math.min(OX+WF,pt.x)),y:Math.max(OY,Math.min(OY+HF,pt.y))};
  drawing=true;
  const pr=document.getElementById('draw-preview');
  pr.setAttribute('fill',zoneFill);pr.setAttribute('stroke',zoneStroke);
  pr.setAttribute('x',drawStart.x);pr.setAttribute('y',drawStart.y);
  pr.setAttribute('width','0');pr.setAttribute('height','0');
  pr.setAttribute('display','block');
});

document.addEventListener('mousemove', ev=>{
  if(drawing&&drawStart){
    const pt=getSVGPt(ev.clientX,ev.clientY);
    const ex=Math.max(OX,Math.min(OX+WF,pt.x));
    const ey=Math.max(OY,Math.min(OY+HF,pt.y));
    const pr=document.getElementById('draw-preview');
    pr.setAttribute('x',Math.min(drawStart.x,ex));
    pr.setAttribute('y',Math.min(drawStart.y,ey));
    pr.setAttribute('width',Math.abs(ex-drawStart.x));
    pr.setAttribute('height',Math.abs(ey-drawStart.y));
  }
  if(draggingElem&&mode==='edit'){
    const e=ELEMENTS.find(el=>el.id===draggingElem);
    if(!e)return;
    const ae=applyEPos(e);
    const pt=getSVGPt(ev.clientX,ev.clientY);
    let nx=Math.max(OX,Math.min(OX+WF-ae.w,pt.x-dragOffX));
    let ny=Math.max(OY,Math.min(OY+HF-ae.h,pt.y-dragOffY));
    // no snap on drag for precision
    if(!elemPos[draggingElem])elemPos[draggingElem]={};
    elemPos[draggingElem].x=nx; elemPos[draggingElem].y=ny;
    const g=document.getElementById('eg-'+draggingElem);
    if(g){
      const r=g.querySelector('rect');
      if(r){r.setAttribute('x',nx);r.setAttribute('y',ny);}
      const big=ae.w>50&&ae.h>28, fs=Math.min(13,Math.max(7,Math.min(ae.w,ae.h)*0.38));
      g.querySelectorAll('text').forEach((t,i)=>{
        t.setAttribute('x',nx+ae.w/2);
        t.setAttribute('y',i===0?(big?ny+ae.h/2-3:ny+ae.h/2+fs*0.4):ny+ae.h/2+11);
      });
      g.querySelectorAll('circle').forEach(c=>{
        c.setAttribute('cx',nx+6);c.setAttribute('cy',ny+6);
      });
    }
    document.getElementById('sg-h').setAttribute('y1',ny);document.getElementById('sg-h').setAttribute('y2',ny);document.getElementById('sg-h').setAttribute('opacity','0.5');
    document.getElementById('sg-v').setAttribute('x1',nx);document.getElementById('sg-v').setAttribute('x2',nx);document.getElementById('sg-v').setAttribute('opacity','0.5');
  }
});

document.addEventListener('mouseup', ev=>{
  if(drawing&&drawStart){
    const pt=getSVGPt(ev.clientX,ev.clientY);
    const ex=Math.max(OX,Math.min(OX+WF,pt.x));
    const ey=Math.max(OY,Math.min(OY+HF,pt.y));
    document.getElementById('draw-preview').setAttribute('display','none');
    drawing=false;
    const w=Math.abs(ex-drawStart.x), h=Math.abs(ey-drawStart.y);
    drawStart=null;
    if(w<12||h<12)return;
    const z={id:'z'+Date.now(),x:Math.min(drawStart?drawStart.x:ex,ex),y:Math.min(drawStart?drawStart.y:ey,ey),w,h,fill:zoneFill,stroke:zoneStroke};
    // recalculate with correct start
    const allZones=getZones();
    const pr=document.getElementById('draw-preview');
    const zx=parseFloat(pr.getAttribute('x')||OX);
    const zy=parseFloat(pr.getAttribute('y')||OY);
    const zw=parseFloat(pr.getAttribute('width')||0);
    const zh=parseFloat(pr.getAttribute('height')||0);
    if(zw<12||zh<12)return;
    const newZ={id:'z'+Date.now(),x:zx,y:zy,w:zw,h:zh,fill:zoneFill,stroke:zoneStroke};
    allZones.push(newZ);setZones(allZones);zones=allZones;
    renderZones();
    openZonePanel(newZ.id);
  }
  if(draggingElem){
    setElemPos(elemPos);
    document.getElementById('sg-h').setAttribute('opacity','0');
    document.getElementById('sg-v').setAttribute('opacity','0');
    const g=document.getElementById('eg-'+draggingElem);
    if(g)g.style.cursor='grab';
    draggingElem=null;
  }
});

// ── RENDER ZONES ──
function renderZones(){
  zones=getZones();
  const layer=document.getElementById('zones-layer');
  layer.innerHTML='';
  zones.forEach(z=>{
    const d=getZoneData(z.id);
    const itemCount=(d.items||[]).length;
    const g=document.createElementNS(SVG_NS,'g');
    g.setAttribute('id','zg-'+z.id);
    g.style.cursor='pointer';

    // In 'elements' view: show zones as outlines only, no text
    // In 'areas' view: show zones with name, responsible, items badge
    const isElementsView=currentView==='elements';
    const isHighlighted=highlightedIds.size===0||highlightedIds.has(z.id);
    const rect=document.createElementNS(SVG_NS,'rect');
    rect.setAttribute('x',z.x);rect.setAttribute('y',z.y);
    rect.setAttribute('width',z.w);rect.setAttribute('height',z.h);
    rect.setAttribute('rx','5');
    rect.setAttribute('fill',isElementsView?'none':z.fill);
    rect.setAttribute('stroke',currentZoneId===z.id?'#0f1f3d':z.stroke);
    rect.setAttribute('stroke-width',currentZoneId===z.id?'3.5':(isHighlighted&&!isElementsView?'2.5':(isElementsView?'1.5':'2')));
    rect.setAttribute('stroke-dasharray',isElementsView?'6,3':'none');
    const baseOpacity=isElementsView?0.5:1;
    rect.setAttribute('opacity',isHighlighted?baseOpacity:(baseOpacity*0.2));
    g.appendChild(rect);

    if(!isElementsView){
      if(d.areaName){
        const t=document.createElementNS(SVG_NS,'text');
        t.setAttribute('x',z.x+8);t.setAttribute('y',z.y+16);
        t.setAttribute('font-size','11');t.setAttribute('font-weight','700');
        t.setAttribute('fill',z.stroke);t.setAttribute('pointer-events','none');
        t.setAttribute('opacity',isHighlighted?'1':'0.2');
        // Clip name to fit within zone width (approx 6.5px per char at font-size 11)
        const maxChars=Math.max(4,Math.floor((z.w-16)/6.5));
        const nm=d.areaName.length>maxChars?d.areaName.substring(0,maxChars-1)+'…':d.areaName;
        t.textContent=nm;g.appendChild(t);
      }
      if(d.resp&&z.h>30){
        const maxCharsR=Math.max(4,Math.floor((z.w-20)/5.5));
        const rn=d.resp.length>maxCharsR?d.resp.substring(0,maxCharsR-1)+'…':d.resp;
        const t2=document.createElementNS(SVG_NS,'text');
        t2.setAttribute('x',z.x+8);t2.setAttribute('y',z.y+(d.areaName?30:16));
        t2.setAttribute('font-size','9');t2.setAttribute('fill',z.stroke);
        t2.setAttribute('opacity',isHighlighted?'0.8':'0.15');t2.setAttribute('pointer-events','none');
        t2.textContent='👤 '+rn;g.appendChild(t2);
      }
      if(itemCount>0){
        const bc=document.createElementNS(SVG_NS,'circle');
        bc.setAttribute('cx',z.x+z.w-10);bc.setAttribute('cy',z.y+10);bc.setAttribute('r','9');
        bc.setAttribute('fill',z.stroke);bc.setAttribute('pointer-events','none');g.appendChild(bc);
        const bt=document.createElementNS(SVG_NS,'text');
        bt.setAttribute('x',z.x+z.w-10);bt.setAttribute('y',z.y+14);
        bt.setAttribute('text-anchor','middle');bt.setAttribute('font-size','9');
        bt.setAttribute('font-weight','700');bt.setAttribute('fill','#fff');
        bt.setAttribute('pointer-events','none');bt.textContent=itemCount;g.appendChild(bt);
      }
    }

    g.addEventListener('click', ev=>{
      if(mode==='view'){ev.stopPropagation();openZonePanel(z.id);}
    });
    layer.appendChild(g);
  });
}

// ── RENDER ELEMENTS ──
function renderElements(){
  elemPos=getElemPos();
  const layer=document.getElementById('elems-layer');
  layer.innerHTML='';
  ELEMENTS.forEach(e=>{
    const ae=applyEPos(e);
    const ed=getElemData(e.id);
    const displayName=ed.name||e.name;
    const g=document.createElementNS(SVG_NS,'g');
    g.setAttribute('id','eg-'+e.id);

    const isSelected=selectedElemId===e.id&&mode==='edit';
    const isAreasView=currentView==='areas'&&mode==='view';
    const isElemHighlighted=highlightedIds.size===0||highlightedIds.has(e.id);
    const rect=document.createElementNS(SVG_NS,'rect');
    rect.setAttribute('x',ae.x);rect.setAttribute('y',ae.y);
    rect.setAttribute('width',ae.w);rect.setAttribute('height',ae.h);
    rect.setAttribute('rx','3');
    rect.setAttribute('fill',isAreasView?'#ccc':ae.color);
    rect.setAttribute('stroke',isSelected?'#0f1f3d':(isAreasView?'#aaa':(isElemHighlighted&&highlightedIds.size>0?'#0f1f3d':ae.stroke)));
    rect.setAttribute('stroke-width',isSelected?'3':(isElemHighlighted&&highlightedIds.size>0&&!isAreasView?'2.5':'1'));
    const baseOp=isAreasView?0.35:0.9;
    rect.setAttribute('opacity',isElemHighlighted?baseOp:baseOp*0.2);
    g.appendChild(rect);

    // Rules dot (yellow) in view mode
    if(ed.rules&&mode==='view'){
      const dot=document.createElementNS(SVG_NS,'circle');
      dot.setAttribute('cx',ae.x+6);dot.setAttribute('cy',ae.y+6);dot.setAttribute('r','5');
      dot.setAttribute('fill','#f39c12');dot.setAttribute('pointer-events','none');
      g.appendChild(dot);
    }

    // Label — single line only (hidden in areas view)
    const cx=ae.x+ae.w/2, cy=ae.y+ae.h/2;
    if(ae.w>14&&ae.h>10&&!isAreasView){
      const fs=Math.min(12,Math.max(7,Math.min(ae.w,ae.h)*0.32));
      const t=document.createElementNS(SVG_NS,'text');
      t.setAttribute('x',cx);t.setAttribute('y',cy);
      t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');
      t.setAttribute('font-size',fs);t.setAttribute('font-weight','700');
      t.setAttribute('fill',darken(ae.color));t.setAttribute('pointer-events','none');
      const maxChars=Math.max(3,Math.floor(ae.w/(fs*0.6)));
      const name=displayName.trim();
      t.textContent=name.length>maxChars?name.substring(0,maxChars-1)+'…':name;
      g.appendChild(t);
    }

    // Events
    if(mode==='view'&&currentView==='elements'){
      g.style.cursor='pointer';
      g.addEventListener('click', ev=>{ev.stopPropagation();openElemPanel(e.id);});
    } else if(mode==='view'&&currentView==='areas'){
      g.style.cursor='default';
      // not clickable in areas view
    } else if(mode==='edit'){
      g.style.cursor='grab';
      g.addEventListener('mousedown', ev=>{
        ev.preventDefault();ev.stopPropagation();
        selectedElemId=e.id;
        draggingElem=e.id;
        const pt=getSVGPt(ev.clientX,ev.clientY);
        dragOffX=pt.x-ae.x; dragOffY=pt.y-ae.y;
        g.style.cursor='grabbing';
        openEditElemPanel(e.id);
      });
    }

    layer.appendChild(g);
  });
}

// ── CLOSE PANEL ──
function highlightSingle(id, type){
  highlightedIds=new Set([id]);
  renderElements();renderZones();
}

function clearHighlight(){
  highlightedIds=new Set();
  renderElements();renderZones();
}

function closePanel(){
  document.getElementById('side-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  currentZoneId=null;currentElemId=null;
  if(mode!=='edit')selectedElemId=null;
  // Only clear highlight if no filter active
  const search=document.getElementById('lp-search').value||'';
  const filter=document.getElementById('lp-filter').value||'';
  if(!search&&!filter)clearHighlight();
  renderZones();
  renderListPanel();
}

// ── ZONE PANEL ──
function openZonePanel(id){
  currentZoneId=id;currentElemId=null;
  highlightedIds=new Set([id]);
  const z=zones.find(z=>z.id===id);if(!z)return;
  const d=getZoneData(id);
  document.getElementById('sp-head').style.background=z.stroke||'#0f1f3d';
  document.getElementById('sp-title').textContent=d.areaName||'Zone';
  document.getElementById('sp-body').innerHTML=buildZoneBody(id,d);
  document.getElementById('side-panel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
  renderZones();
  renderListPanel();
}

function getElemsInZone(zoneId){
  const z=zones.find(z=>z.id===zoneId);if(!z)return[];
  return ELEMENTS.filter(e=>{
    const ae=applyEPos(e);
    const ed=getElemData(e.id);
    const name=ed.name||e.name;
    // Check if element center is inside zone bounds
    const cx=ae.x+ae.w/2, cy=ae.y+ae.h/2;
    return cx>=z.x&&cx<=z.x+z.w&&cy>=z.y&&cy<=z.y+z.h;
  }).map(e=>{const ed=getElemData(e.id);return{id:e.id,name:ed.name||e.name,color:applyEPos(e).color,stroke:applyEPos(e).stroke};});
}

function buildZoneBody(id,d){
  const itemsHtml=(d.items||[]).map((item,i)=>`
    <div class="item-row">
      <span class="item-name">${item.name}</span>
      <div style="display:flex;align-items:center;gap:4px">
        <button class="qty-btn" onclick="changeQty('${id}',${i},-1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty('${id}',${i},+1)">+</button>
      </div>
      <button class="item-del" onclick="removeItem('${id}',${i})">×</button>
    </div>`).join('');

  // Elements inside this zone
  const elemsInZone=getElemsInZone(id);
  const elemsHtml=elemsInZone.length
    ? elemsInZone.map(e=>`<span style="display:inline-flex;align-items:center;gap:4px;background:#f0f2f5;border:1px solid #e0e0e0;border-radius:5px;padding:3px 8px;font-size:11px;font-weight:500;margin:2px"><span style="width:8px;height:8px;border-radius:2px;background:${e.color};border:1px solid ${e.stroke};display:inline-block;flex-shrink:0"></span>${e.name}</span>`).join('')
    : '<span class="empty-hint">No elements detected in this area</span>';

  return `
    <div>
      <div class="sec-title"><span>🏷 Area name</span><button class="edit-btn" onclick="toggleZoneEdit('areaName','${id}')">Edit</button></div>
      <div id="z-areaName-disp" class="area-name-disp">${d.areaName||'<span class="empty-hint">Click Edit to set a name</span>'}</div>
      <div id="z-areaName-edit" style="display:none;margin-top:8px">
        <input class="field-inp" id="z-areaName-inp" value="${d.areaName||''}" placeholder="e.g. Production Zone, Storage A...">
        <div class="btn-row"><button class="save-btn" onclick="saveZoneField('areaName','${id}')">Save</button><button class="cancel-btn" onclick="toggleZoneEdit('areaName','${id}')">Cancel</button></div>
      </div>
    </div>
    <div>
      <div class="sec-title"><span>👤 Responsible</span><button class="edit-btn" onclick="toggleZoneEdit('resp','${id}')">Edit</button></div>
      <div id="z-resp-disp" class="resp-row">
        <div class="resp-av">${d.resp?d.resp.charAt(0).toUpperCase():'?'}</div>
        <div class="resp-name">${d.resp||'Not assigned'}</div>
      </div>
      <div id="z-resp-edit" style="display:none;margin-top:8px">
        <input class="field-inp" id="z-resp-inp" value="${d.resp||''}" placeholder="Responsible name">
        <div class="btn-row"><button class="save-btn" onclick="saveZoneField('resp','${id}')">Save</button><button class="cancel-btn" onclick="toggleZoneEdit('resp','${id}')">Cancel</button></div>
      </div>
    </div>
    <div>
      <div class="sec-title"><span>🪑 Elements in this area</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;min-height:28px">${elemsHtml}</div>
    </div>
    <div>
      <div class="sec-title"><span>📋 Rules & Guidelines</span><button class="edit-btn" onclick="toggleZoneEdit('rules','${id}')">Edit</button></div>
      <div id="z-rules-disp" class="rules-box">${d.rules?d.rules.replace(/\n/g,'<br>'):'<span class="empty-hint">No rules yet — click Edit to add.</span>'}</div>
      <div id="z-rules-edit" style="display:none;margin-top:8px">
        <textarea class="field-ta" id="z-rules-inp" placeholder="e.g.&#10;- Keep area clean&#10;- Return tools after use">${d.rules||''}</textarea>
        <div class="btn-row"><button class="save-btn" onclick="saveZoneField('rules','${id}')">Save</button><button class="cancel-btn" onclick="toggleZoneEdit('rules','${id}')">Cancel</button></div>
      </div>
    </div>
    <div>
      <div class="sec-title"><span>📦 Items stored here</span></div>
      <div id="z-items-list">${itemsHtml||'<div class="empty-hint" style="padding:4px 0">No items yet.</div>'}</div>
      <div class="add-row">
        <input class="add-inp" id="z-new-name" placeholder="Item name..." onkeydown="if(event.key==='Enter')addZoneItem('${id}')">
        <input class="add-qty" id="z-new-qty" type="number" min="1" value="1">
        <button class="save-btn" onclick="addZoneItem('${id}')">+ Add</button>
      </div>
    </div>
    <div><button class="del-btn" onclick="deleteZone('${id}')">🗑 Delete this zone</button></div>`;
}

function toggleZoneEdit(field,id){
  const ed=document.getElementById('z-'+field+'-edit');
  ed.style.display=ed.style.display==='none'?'block':'none';
}

function saveZoneField(field,id){
  const d=getZoneData(id);
  const val=document.getElementById('z-'+field+'-inp')||document.getElementById('z-'+field+'-ta');
  const v=document.getElementById('z-'+field+(field==='rules'?'-inp':'-inp')).value.trim();
  d[field]=v;
  setZoneData(id,d);
  // Update display
  if(field==='areaName'){
    document.getElementById('z-areaName-disp').innerHTML=v||'<span class="empty-hint">Click Edit to set a name</span>';
    document.getElementById('sp-title').textContent=v||'Zone';
  }else if(field==='resp'){
    document.getElementById('z-resp-disp').innerHTML=`<div class="resp-av">${v?v.charAt(0).toUpperCase():'?'}</div><div class="resp-name">${v||'Not assigned'}</div>`;
  }else if(field==='rules'){
    document.getElementById('z-rules-disp').innerHTML=v?v.replace(/\n/g,'<br>'):'<span class="empty-hint">No rules yet — click Edit to add.</span>';
  }
  toggleZoneEdit(field,id);
  renderZones();
}

function addZoneItem(id){
  const name=document.getElementById('z-new-name').value.trim();
  const qty=parseInt(document.getElementById('z-new-qty').value)||1;
  if(!name)return;
  const d=getZoneData(id);
  if(!d.items)d.items=[];
  const ex=d.items.find(i=>i.name.toLowerCase()===name.toLowerCase());
  if(ex)ex.qty+=qty; else d.items.push({name,qty});
  setZoneData(id,d);
  document.getElementById('z-items-list').innerHTML=d.items.map((item,i)=>`
    <div class="item-row">
      <span class="item-name">${item.name}</span>
      <div style="display:flex;align-items:center;gap:4px">
        <button class="qty-btn" onclick="changeQty('${id}',${i},-1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty('${id}',${i},+1)">+</button>
      </div>
      <button class="item-del" onclick="removeItem('${id}',${i})">×</button>
    </div>`).join('');
  document.getElementById('z-new-name').value='';
  document.getElementById('z-new-qty').value='1';
  document.getElementById('z-new-name').focus();
  renderZones();
}

function changeQty(zoneId,i,delta){
  const d=getZoneData(zoneId);
  d.items[i].qty=Math.max(1,d.items[i].qty+delta);
  setZoneData(zoneId,d);
  document.querySelectorAll('#z-items-list .qty-num')[i].textContent=d.items[i].qty;
}

function removeItem(zoneId,i){
  const d=getZoneData(zoneId);
  d.items.splice(i,1);setZoneData(zoneId,d);
  document.getElementById('z-items-list').innerHTML=d.items.map((item,j)=>`
    <div class="item-row">

function openElemPanel(id){

function toggleElemRulesEdit(id){
  const ed=document.getElementById('e-rules-edit');
  ed.style.display=ed.style.display==='none'?'block':'none';
}

function saveElemRules(id){
  const v=document.getElementById('e-rules-inp').value.trim();
  const ed=getElemData(id);ed.rules=v;setElemData(id,ed);
  document.getElementById('e-rules-disp').innerHTML=v?v.replace(/\n/g,'<br>'):'<span class="empty-hint">No rules defined yet — click Edit to add.</span>';
  toggleElemRulesEdit(id);
  renderElements();
}

function addElemItem(id){
  const name=document.getElementById('e-new-name').value.trim();
  const qty=parseInt(document.getElementById('e-new-qty').value)||1;
  if(!name)return;
  const ed=getElemData(id);
  if(!ed.items)ed.items=[];
  const ex=ed.items.find(i=>i.name.toLowerCase()===name.toLowerCase());
  if(ex)ex.qty+=qty; else ed.items.push({name,qty});
  setElemData(id,ed);
  refreshElemItemsList(id,ed);
  document.getElementById('e-new-name').value='';
  document.getElementById('e-new-qty').value='1';
  document.getElementById('e-new-name').focus();
}
function changeElemQty(id,i,delta){
  const ed=getElemData(id);
  ed.items[i].qty=Math.max(1,ed.items[i].qty+delta);
  setElemData(id,ed);
  document.querySelectorAll('#e-items-list .qty-num')[i].textContent=ed.items[i].qty;
}
function removeElemItem(id,i){
  const ed=getElemData(id);
  ed.items.splice(i,1);setElemData(id,ed);
  refreshElemItemsList(id,ed);
}
function refreshElemItemsList(id,ed){
  const list=document.getElementById('e-items-list');if(!list)return;
  list.innerHTML=ed.items.map((item,i)=>`
    <div class="item-row">
      <span class="item-name">${item.name}</span>
      <div style="display:flex;align-items:center;gap:4px">
        <button class="qty-btn" onclick="changeElemQty('${id}',${i},-1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeElemQty('${id}',${i},+1)">+</button>
      </div>
      <button class="item-del" onclick="removeElemItem('${id}',${i})">×</button>
    </div>`).join('')||'<div class="empty-hint" style="padding:4px 0">No items yet.</div>';
}

function saveElemName(id){
  const v=document.getElementById('e-name-inp').value.trim();
  const ed=getElemData(id);ed.name=v;setElemData(id,ed);
  // Update ELEMENTS array name too
  const el=ELEMENTS.find(e=>e.id===id);if(el&&v)el.name=v;
  // Update custom elems storage
  const custom=ls('wh_custom_elems')||[];
  const ci=custom.findIndex(e=>e.id===id);
  if(ci>-1){custom[ci].name=v;lsSet('wh_custom_elems',custom);}
  document.getElementById('sp-title').textContent=v||el?.name||'Element';
  renderElements();
}

function saveElemDims(id){
  const e=ELEMENTS.find(el=>el.id===id);if(!e)return;
  if(!elemPos[id])elemPos[id]={};
  const xv=parseFloat(document.getElementById('ep-x').value);
  const yv=parseFloat(document.getElementById('ep-y').value);
  const wv=parseFloat(document.getElementById('ep-w').value);
  const hv=parseFloat(document.getElementById('ep-h').value);
  if(!isNaN(xv))elemPos[id].x=Math.round(xv*SNAP)+OX;
  if(!isNaN(yv))elemPos[id].y=Math.round(yv*SNAP)+OY;
  if(!isNaN(wv)&&wv>0)elemPos[id].w=Math.round(wv*SNAP);
  if(!isNaN(hv)&&hv>0)elemPos[id].h=Math.round(hv*SNAP);
  setElemPos(elemPos);
  renderElements();
  openEditElemPanel(id);
}

function resetElem(id){
  delete elemPos[id];setElemPos(elemPos);
  renderElements();openEditElemPanel(id);
}

  addPanelOpen=!addPanelOpen;
  document.getElementById('add-panel').style.display=addPanelOpen?'block':'none';
  document.getElementById('btn-add').style.background=addPanelOpen?'rgba(39,174,96,1)':'rgba(39,174,96,0.8)';
}

function addElemFromPreset(idx){
  const p=PRESETS[idx];
  const customName=idx===PRESETS.length-1?document.getElementById('custom-name-inp').value.trim()||p.name:p.name;
  const customW=idx===PRESETS.length-1?parseFloat(document.getElementById('custom-w-inp').value)||p.mw:p.mw;
  const customH=idx===PRESETS.length-1?parseFloat(document.getElementById('custom-h-inp').value)||p.mh:p.mh;
  const id='new-'+Date.now()+'-'+Math.floor(Math.random()*99);
  // Place in center of floor
  const w=Math.round(customW*SNAP), h=Math.round(customH*SNAP);
  const x=OX+Math.round((WF-w)/2/SNAP)*SNAP;
  const y=OY+Math.round((HF-h)/2/SNAP)*SNAP;
  // Save to localStorage only — will be loaded from there
  const customElems=ls('wh_custom_elems')||[];
  const newElem={id,label:'',name:customName,color:p.color,stroke:p.stroke,x,y,w,h,isNew:true};
  customElems.push(newElem);
  lsSet('wh_custom_elems',customElems);
  // Save position
  if(!elemPos[id])elemPos[id]={x,y,w,h};
  setElemPos(elemPos);
  // Save name in elem data
  const ed=getElemData(id);ed.name=customName;setElemData(id,ed);
  // Add to runtime array
  ELEMENTS.push(newElem);
  renderElements();
  addPanelOpen=false;
  document.getElementById('add-panel').style.display='none';
  document.getElementById('btn-add').style.background='rgba(39,174,96,0.8)';
  // Switch to edit mode to immediately move it
  setMode('edit');
  selectedElemId=id;
  openEditElemPanel(id);
}

function deleteElem(id){
  const idx=ELEMENTS.findIndex(e=>e.id===id);
  if(idx>-1)ELEMENTS.splice(idx,1);
  // Remove from custom elems storage
  const custom=(ls('wh_custom_elems')||[]).filter(e=>e.id!==id);
  lsSet('wh_custom_elems',custom);
  // Save deleted ID so it doesn't come back on reload
  const deleted=ls('wh_deleted_elems')||[];
  if(!deleted.includes(id)){deleted.push(id);lsSet('wh_deleted_elems',deleted);}
  // Remove position and data
  delete elemPos[id];setElemPos(elemPos);
  closePanel();
  renderElements();
}

// ── VIEW MODE (elements / areas) ──
let currentView = 'elements'; // 'elements' or 'areas'
let highlightedIds = new Set(); // IDs to highlight (empty = no filter active)

function setView(v){
  currentView=v;
  document.getElementById('vtab-elements').className='vtab'+(v==='elements'?' active':'');
  document.getElementById('vtab-areas').className='vtab'+(v==='areas'?' active':'');
  document.getElementById('lp-title').textContent=v==='elements'?'Elements':'Areas';
  renderElements();
  renderZones();
  renderListPanel();
  populateListFilter();
}

// ── LIST PANEL ──
function populateListFilter(){
  const sel=document.getElementById('lp-filter');
  const cur=sel.value;
  if(currentView==='elements'){
    // Filter by zone
    const zoneNames=[...new Set(zones.map(z=>{const d=getZoneData(z.id);return d.areaName;}).filter(Boolean))].sort();
    sel.innerHTML='<option value="">All zones</option>'+zoneNames.map(n=>`<option value="${n}">${n}</option>`).join('');
  }else{
    // Filter by responsible
    const resps=[...new Set(zones.map(z=>{const d=getZoneData(z.id);return d.resp;}).filter(Boolean))].sort();
    sel.innerHTML='<option value="">All responsible</option>'+resps.map(r=>`<option value="${r}">${r}</option>`).join('');
  }
  sel.value=cur;
}

function renderListPanel(){
  const search=(document.getElementById('lp-search').value||'').toLowerCase();
  const filter=document.getElementById('lp-filter').value;
  const list=document.getElementById('lp-list');
  const hasFilter=!!(search||filter);

  if(currentView==='elements'){
    // List all elements
    let items_all=ELEMENTS.map(e=>{
      const ed=getElemData(e.id);
      const ae=applyEPos(e);
      const name=ed.name||e.name;
      // Find which zone this element is in
      const zone=zones.find(z=>{
        const d=getZoneData(z.id);
        return ae.x>=z.x&&ae.x+ae.w<=z.x+z.w&&ae.y>=z.y&&ae.y+ae.h<=z.y+z.h;
      });
      const zoneName=zone?getZoneData(zone.id).areaName||'':'';
      return {id:e.id,name,color:ae.color,stroke:ae.stroke,zoneName,hasRules:!!ed.rules};
    });
    if(search)items=items.filter(i=>i.name.toLowerCase().includes(search)||i.zoneName.toLowerCase().includes(search));
    if(filter)items=items.filter(i=>i.zoneName===filter);
    if(!items.length){list.innerHTML='<div class="lp-empty">No elements found</div>';return;}
    list.innerHTML=items.map(i=>`
      <div class="lp-item${currentElemId===i.id?' active':''}" onclick="openElemPanel('${i.id}')">
        <span class="lp-dot" style="background:${i.color};border:1px solid ${i.stroke}"></span>
        <div style="flex:1;min-width:0">
          <div class="lp-name">${i.name}</div>
          ${i.zoneName?`<div class="lp-sub">${i.zoneName}</div>`:''}
        </div>
        ${i.hasRules?'<span style="font-size:10px">🟡</span>':''}
      </div>`).join('');
  }else{
    // List all zones
    let allZones=zones.map(z=>{
      const d=getZoneData(z.id);
      const itemCount=(d.items||[]).length;
      return {id:z.id,name:d.areaName||'(unnamed)',resp:d.resp||'',fill:z.fill,stroke:z.stroke,itemCount};
    });
    let items=[...allZones];
    if(search)items=items.filter(i=>i.name.toLowerCase().includes(search)||i.resp.toLowerCase().includes(search));
    if(filter)items=items.filter(i=>i.resp===filter);
    // Update highlight
    highlightedIds=hasFilter?new Set(items.map(i=>i.id)):new Set();
    renderZones();renderElements();
    if(!items.length){list.innerHTML='<div class="lp-empty">No areas found</div>';return;}
    list.innerHTML=items.map(i=>`
      <div class="lp-item${currentZoneId===i.id?' active':''}" onclick="openZonePanel('${i.id}');highlightSingle('${i.id}','zone')">
        <span class="lp-dot" style="background:${i.fill};border:1px solid ${i.stroke}"></span>
        <div style="flex:1;min-width:0">
          <div class="lp-name">${i.name}</div>
          ${i.resp?`<div class="lp-sub">👤 ${i.resp}</div>`:''}
        </div>
        ${i.itemCount>0?`<span class="lp-badge">${i.itemCount}</span>`:''}
      </div>`).join('');
  }
}

(async function(){
  // 1. Render immediately with localStorage
  zones=getZones();elemPos=getElemPos();
  const sc0=ls('wh_custom_elems')||[];
  sc0.forEach(e=>{if(!ELEMENTS.find(el=>el.id===e.id)){const ed=getElemData(e.id);if(ed.name)e.name=ed.name;ELEMENTS.push(e);}});
  const di0=ls('wh_deleted_elems')||[];
  di0.forEach(id=>{const idx=ELEMENTS.findIndex(e=>e.id===id);if(idx>-1)ELEMENTS.splice(idx,1);});
  renderElements();renderZones();populateListFilter();renderListPanel();

  // 2. Load from Firebase
  await loadFromFirebase();
  zones=getZones();elemPos=getElemPos();
  const sc1=ls('wh_custom_elems')||[];
  sc1.forEach(e=>{if(!ELEMENTS.find(el=>el.id===e.id)){const ed=getElemData(e.id);if(ed.name)e.name=ed.name;ELEMENTS.push(e);}});
  const di1=ls('wh_deleted_elems')||[];
  di1.forEach(id=>{const idx=ELEMENTS.findIndex(e=>e.id===id);if(idx>-1)ELEMENTS.splice(idx,1);});
  renderElements();renderZones();populateListFilter();renderListPanel();

  // 3. Real-time sync
  startRealtimeSync();
})();
